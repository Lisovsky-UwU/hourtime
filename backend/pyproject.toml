[project]
name = "hourtime"
version = "0.1.0"
description = "Self-hosted time tracker"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    # IANA zones for `zoneinfo`: Windows and slim images have no system copy.
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    # Astral's type checker, the ruff-family replacement for mypy.
    "ty>=0.0.80",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hourtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
# Autogenerated by alembic; leave the generated formatting alone.
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["hourtime"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.12"

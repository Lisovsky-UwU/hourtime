services:
  postgres:
    image: postgres:18-alpine
    container_name: hourtime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hourtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hourtime}
      POSTGRES_DB: ${POSTGRES_DB:-hourtime}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 wants the whole directory mounted, not the `data` subdir.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hourtime} -d ${POSTGRES_DB:-hourtime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: hourtime-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

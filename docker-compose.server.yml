# Production stack for a host that already runs PostgreSQL, Redis and a TLS-terminating
# reverse proxy: only the API and the static frontend live here. Select it in .env:
#   COMPOSE_FILE=docker-compose.server.yml
# The API joins the external Docker networks of PostgreSQL and Redis; the web container
# listens on localhost only and proxies /api to the API.

services:
  # Not "backend": the service name becomes a DNS alias on the shared networks,
  # where other projects may already answer to it.
  api:
    build: ./backend
    image: hourtime-api
    restart: unless-stopped
    env_file: .env
    networks: [default, postgres, redis]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build: ./frontend
    image: hourtime-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  postgres:
    name: ${POSTGRES_NETWORK:?set POSTGRES_NETWORK in .env}
    external: true
  redis:
    name: ${REDIS_NETWORK:?set REDIS_NETWORK in .env}
    external: true
